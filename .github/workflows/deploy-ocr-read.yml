name: Deploy OCR Read Edge Function

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Enter DEPLOY_OCR_READ to confirm deployment'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: contractvault-ocr-read-deploy
  cancel-in-progress: false

jobs:
  deploy-ocr-read:
    name: Deploy ocr-read
    runs-on: ubuntu-latest
    environment: supabase-production
    timeout-minutes: 10

    steps:
      - name: Validate deployment confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [ "$CONFIRMATION" != "DEPLOY_OCR_READ" ]; then
            echo "Deployment cancelled: confirmation does not match."
            exit 1
          fi

      - name: Validate feature branch
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$GITHUB_REF_NAME" != "feature/photo-ocr-milestone-1" ]; then
            echo "Deployment cancelled: the workflow must run from feature/photo-ocr-milestone-1."
            exit 1
          fi

      - name: Check out feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feature/photo-ocr-milestone-1
          persist-credentials: false

      - name: Validate project ID
        env:
          PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID || vars.SUPABASE_PROJECT_ID }}
        run: |
          if [ "$PROJECT_ID" != "gfpjtanpmlmqwxdgcyqt" ]; then
            echo "Deployment cancelled: unexpected Supabase project ID."
            exit 1
          fi

      - name: Validate OCR Read JWT configuration
        run: |
          grep -Fqx '[functions.ocr-read]' supabase/config.toml
          grep -Fqx 'verify_jwt = true' supabase/config.toml

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@d347ba47d3fb7eeeddbbc793bc8d4779caf773ea
        with:
          version: v3.0.0

      - name: Deploy OCR Read only
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID || vars.SUPABASE_PROJECT_ID }}
        run: |
          supabase functions deploy ocr-read \
            --remote="$SUPABASE_PROJECT_ID" \
            --use-api
